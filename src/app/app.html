<button (click)="toggleLogin()">
  Toggle Login
</button>

@if (isLogged) {
  <h2>User logged in</h2>
} @else {
  <h2>User not logged in</h2>
}

<h1>Hello {{ name }}</h1>

<input
  type="text"
  [value]="name"
  (input)="updateName($event)"
/>

<br>
<br>

<button (click)="sayHello()">Click Me</button>

<br>
<br>

<h1>My Fruits</h1>

<input
  type="text"
  [value]="newFruit"
  (input)="updateFruit($event)"
/>

<ul>
  @for (fruit of fruits; track fruit) {
    <li>{{ fruit }}</li>
  }
</ul>

<button (click)="addFruit()">
  Add
</button>

<p>Selected User: {{ selectedUser }}</p>

<app-user-card [name]="'Valdir'" (selected)="handleSelectedUser($event)"></app-user-card>
<app-user-card [name]="'Maria'" (selected)="handleSelectedUser($event)"></app-user-card>
